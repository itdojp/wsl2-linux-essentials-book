name: Nav + Pages Link Check

on:
  schedule:
    - cron: '13 3 * * 1'
  workflow_dispatch: {}

env:
  # Temporary opt-in during GitHub Actions' Node 20 -> Node 24 transition.
  # Ref: https://github.blog/changelog/2026-03-06-github-actions-transitions-from-node-20-to-node-24/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  nav-link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install PyYAML
        run: python3 -m pip install --user pyyaml

      - name: Build URL list
        id: build
        run: |
          python3 - << 'PY'
          import os
          from pathlib import Path
          import yaml
          repo = os.environ.get('GITHUB_REPOSITORY','').split('/')[-1]
          cfg = Path('docs/_config.yml') if Path('docs/_config.yml').exists() else Path('_config.yml')
          baseurl = f'/{repo}'
          if cfg.exists():
              try:
                  data = yaml.safe_load(cfg.read_text(encoding='utf-8')) or {}
                  bu = data.get('baseurl')
                  if isinstance(bu,str) and bu.strip():
                      baseurl = bu.strip()
              except Exception:
                  # Fallback to naive parse but strip quotes
                  for line in cfg.read_text(encoding='utf-8').splitlines():
                      if line.strip().startswith('baseurl:'):
                          val = line.split(':',1)[1].strip()
                          baseurl = val.strip('"\'\' ')
                          break
          # Ensure baseurl starts with '/'
          if not baseurl.startswith('/'):
              baseurl = '/' + baseurl
          def normalize_path(path):
              if not isinstance(path, str):
                  return ''
              path = path.strip()
              if not path or path.startswith(('http://', 'https://', 'mailto:')):
                  return ''
              if not path.startswith('/'):
                  path = '/' + path
              lower = path.lower()
              if lower.endswith(('.md', '.html', '.htm', '.pdf', '.txt')):
                  return path
              return path if path.endswith('/') else path + '/'
          def read_nav():
              nav = None
              for name in ['navigation.yml', 'navigation.yaml', 'navigation.json']:
                  candidate = Path('docs/_data') / name
                  if candidate.exists():
                      nav = candidate
                      break
              if nav is None:
                  return []
              data = yaml.safe_load(nav.read_text(encoding='utf-8')) or {}
              paths = []
              def walk(value):
                  if isinstance(value, dict):
                      p = normalize_path(value.get('path'))
                      if p:
                          paths.append(p)
                      for nested_key in ['items', 'children']:
                          nested = value.get(nested_key)
                          if isinstance(nested, list):
                              for sub in nested:
                                  walk(sub)
                  elif isinstance(value, list):
                      for sub in value:
                          walk(sub)
              for key in ['introduction','chapters','additional','resources','appendices','afterword']:
                  walk(data.get(key) or [])
              return paths
          def discover():
              paths=[]
              # Support both grouped directories such as docs/chapters/foo/ and
              # this book's root-level chapter directories such as docs/chapter0/.
              for seg in ['introduction','chapters','additional','resources','appendices','afterword']:
                  d = Path('docs')/seg
                  if d.is_dir():
                      for child in sorted(d.iterdir()):
                          if child.is_dir():
                              paths.append(f'/{seg}/{child.name}/')
              for md in sorted(Path('docs').glob('*.md')):
                  if md.name == 'index.md':
                      continue
                  paths.append(f'/{md.stem}/')
              for child in sorted(Path('docs').iterdir()):
                  if child.is_dir() and (child/'index.md').exists() and not child.name.startswith(('_', 'assets')):
                      paths.append(f'/{child.name}/')
              return paths
          paths = read_nav() or discover() or ['/']
          # Always include index
          if '/' not in paths: paths.insert(0,'/')
          base = f'https://itdojp.github.io{baseurl}'
          urls = [ (p, f"{base}{p}") for p in paths ]
          out = '\n'.join([f"{p}\t{u}" for p,u in urls])
          Path('urls.txt').write_text(out, encoding='utf-8')
          print(out)
          PY
          echo "list=urls.txt" >> $GITHUB_OUTPUT

      - name: Probe URLs
        run: |
          failures=0
          while IFS=$'\t' read -r path url; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -L "$url")
            echo "$code $url"
            if [ "$code" != "200" ]; then failures=$((failures+1)); fi
          done < urls.txt
          if [ $failures -gt 0 ]; then
            echo "Found $failures non-200 URLs" >&2
            exit 1
          fi
