name: Book QA (Unicode + Links + Textlint + Layout Risk)

on:
  pull_request:
  push:
    branches: [ main ]

env:
  # Temporary opt-in during GitHub Actions' Node 20 -> Node 24 transition.
  # Ref: https://github.blog/changelog/2026-03-06-github-actions-transitions-from-node-20-to-node-24/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  qa:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read

    steps:
      - name: Checkout book
        uses: actions/checkout@v6

      - name: Checkout book-formatter (pinned)
        uses: actions/checkout@v6
        with:
          repository: itdojp/book-formatter
          ref: cff9fcf8bae31140f07b358d314fc64173cb7013
          path: book-formatter

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            book-formatter/package-lock.json

      - name: Install dependencies (book)
        run: npm ci --omit=optional

      - name: Install dependencies (book-formatter)
        working-directory: book-formatter
        run: npm ci

      - name: Determine scan directory
        id: scan
        shell: bash
        run: |
          if [ -d docs ]; then
            echo "dir=docs" >> "$GITHUB_OUTPUT"
          else
            echo "dir=." >> "$GITHUB_OUTPUT"
          fi

      - name: Book metadata/navigation consistency
        run: python3 scripts/check_metadata_consistency.py

      - name: WSL cron service contract (source + self-test)
        run: |
          python3 scripts/check_cron_service_contract.py --self-test
          python3 scripts/check_cron_service_contract.py

      - name: WSL network exposure contract (source + self-test + runtime)
        run: |
          python3 scripts/check_network_exposure_contract.py --self-test
          python3 scripts/check_network_exposure_contract.py
          python3 scripts/check_network_exposure_contract.py --runtime-test

      - name: Learning path and time contract (source + self-test)
        run: |
          python3 scripts/check_learning_path_contract.py --self-test
          python3 scripts/check_learning_path_contract.py

      - name: WordPress supply-chain contract (source + self-test)
        run: |
          python3 scripts/check_wordpress_supply_chain_contract.py --self-test
          python3 scripts/check_wordpress_supply_chain_contract.py

      - name: Security audit (book dependencies)
        run: npm run check:security

      - name: Unicode check (fail on warnings)
        run: node book-formatter/scripts/check-unicode.js "${{ steps.scan.outputs.dir }}" --allowlist .book-formatter/unicode-allowlist.json --fail-on warn

      - name: Textlint (PRH dictionary; fail on errors)
        run: node book-formatter/scripts/check-textlint.js "${{ steps.scan.outputs.dir }}" --fail-on error

      - name: Link check (internal + anchors)
        run: node book-formatter/scripts/check-links.js "${{ steps.scan.outputs.dir }}"

      - name: Layout risk scan (long lines / tables / images)
        run: node book-formatter/scripts/check-layout-risk.js "${{ steps.scan.outputs.dir }}" --fail-on error --output "${{ runner.temp }}/layout-risk-report.json"

      - name: Markdown structure check (front matter / headings / fences)
        run: node book-formatter/scripts/check-markdown-structure.js "${{ steps.scan.outputs.dir }}" --fail-on error --output "${{ runner.temp }}/markdown-structure-report.json"

      - name: Upload markdown structure report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: markdown-structure-report
          path: ${{ runner.temp }}/markdown-structure-report.json
          if-no-files-found: ignore

      - name: Upload layout risk report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: layout-risk-report
          path: ${{ runner.temp }}/layout-risk-report.json
          if-no-files-found: ignore
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Build (Jekyll; GitHub Pages compatible)
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./${{ steps.scan.outputs.dir }}
          destination: ./_site

      - name: WSL cron service contract (built site)
        run: python3 scripts/check_cron_service_contract.py --built-site _site

      - name: WSL network exposure contract (built site)
        run: python3 scripts/check_network_exposure_contract.py --built-site _site

      - name: Learning path and time contract (built site)
        run: python3 scripts/check_learning_path_contract.py --built-site _site

      - name: WordPress supply-chain contract (built site)
        run: python3 scripts/check_wordpress_supply_chain_contract.py --built-site _site

      - name: Smoke check built site (top + navigation + assets)
        shell: bash
        run: |
          python3 -m pip install --user pyyaml
          python3 - << 'PY'
          import sys
          from pathlib import Path
          import yaml

          scan_dir = Path("${{ steps.scan.outputs.dir }}").resolve()
          site_dir = Path("_site").resolve()

          if not site_dir.exists():
            print(f"::error::Built site directory not found: {site_dir}")
            sys.exit(1)

          def normalize_path(p):
            if not isinstance(p, str):
              return None
            p = p.strip()
            if not p:
              return None
            if p.startswith(("http://", "https://", "mailto:")):
              return None
            if not p.startswith("/"):
              p = "/" + p
            lower = p.lower()
            if lower.endswith((".md", ".html", ".htm", ".pdf", ".txt")):
              return p
            return p if p.endswith("/") else p + "/"

          def read_nav_paths():
            nav = None
            for name in ("navigation.yml", "navigation.yaml", "navigation.json"):
              candidate = scan_dir / "_data" / name
              if candidate.exists():
                nav = candidate
                break
            if nav is None:
              return []
            try:
              raw = nav.read_text(encoding="utf-8")
              data = yaml.safe_load(raw) or {}
            except yaml.YAMLError as e:
              nav_display = nav
              try:
                nav_display = nav.relative_to(Path.cwd())
              except ValueError:
                pass
              print(f"::error file={nav_display}::Failed to parse navigation data: {e}")
              sys.exit(1)
            paths = []

            def walk(value):
              if isinstance(value, dict):
                p = normalize_path(value.get("path"))
                if p:
                  paths.append(p)
                for nested_key in ("items", "children"):
                  nested = value.get(nested_key)
                  if isinstance(nested, list):
                    for sub in nested:
                      walk(sub)
              elif isinstance(value, list):
                for sub in value:
                  walk(sub)

            # Keep this segment list broad to support different book structures.
            for key in ["introduction", "chapters", "additional", "resources", "appendices", "afterword"]:
              walk(data.get(key) or [])
            return paths

          def discover_paths():
            paths = []
            # Support both grouped structures (docs/chapters/foo/) and this
            # book's root-level chapter directories (docs/chapter0/).
            for seg in ["introduction", "chapters", "additional", "resources", "appendices", "afterword"]:
              d = scan_dir / seg
              if d.is_dir():
                for child in sorted(d.iterdir()):
                  if child.is_dir():
                    paths.append(f"/{seg}/{child.name}/")
            for md in sorted(scan_dir.glob("*.md")):
              if md.name == "index.md":
                continue
              paths.append(f"/{md.stem}/")
            for child in sorted(scan_dir.iterdir()):
              if child.is_dir() and (child / "index.md").exists() and not child.name.startswith(("_", "assets")):
                paths.append(f"/{child.name}/")
            return paths

          paths = read_nav_paths() or discover_paths() or ["/"]
          if "/" not in paths:
            paths.insert(0, "/")

          # De-dup while keeping order
          seen = set()
          uniq = []
          for p in paths:
            if p in seen:
              continue
            seen.add(p)
            uniq.append(p)
          paths = uniq

          def exists_any(candidates):
            for c in candidates:
              if c.exists() and c.is_file() and c.stat().st_size > 0:
                return True
            return False

          def candidates_for(path_str):
            if path_str == "/":
              return [site_dir / "index.html"]
            rel = path_str.lstrip("/")
            lower = path_str.lower()
            if lower.endswith((".html", ".htm", ".pdf", ".txt")):
              return [site_dir / rel]
            if lower.endswith(".md"):
              # Jekyll usually converts Markdown to HTML, but Markdown without front matter may be copied as-is.
              html_rel = rel[:-3] + ".html"
              return [site_dir / rel, site_dir / html_rel]
            # Directory-like (pretty permalink)
            rel_dir = rel
            if not rel_dir.endswith("/"):
              rel_dir += "/"
            # Both `/<dir>/index.html` and `/<dir>.html` are accepted.
            return [site_dir / rel_dir / "index.html", site_dir / (rel_dir[:-1] + ".html")]

          missing = []
          for p in paths:
            if not exists_any(candidates_for(p)):
              missing.append(p)

          # Ensure core assets exist in the built output.
          required_assets = [
            "assets/css/main.css",
            "assets/css/syntax-highlighting.css",
            "assets/js/theme.js",
            "assets/js/search.js",
            "assets/js/code-copy-lightweight.js",
          ]
          missing_assets = [
            a
            for a in required_assets
            if not (
              (site_dir / a).exists()
              and (site_dir / a).is_file()
              and (site_dir / a).stat().st_size > 0
            )
          ]

          if missing or missing_assets:
            if missing:
              print("::error::Missing pages in built site:")
              for p in missing:
                print(f"  - {p}")
            if missing_assets:
              print("::error::Missing assets in built site:")
              for a in missing_assets:
                print(f"  - {a}")
            sys.exit(1)

          print(f"OK: built site smoke check passed ({len(paths)} paths, {len(required_assets)} assets)")
          PY
